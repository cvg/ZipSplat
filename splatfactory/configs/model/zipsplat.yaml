# ZipSplat (networks/zipsplat.py) on DA3-Giant. The model, head and loss defaults are the
# final recipe. Only the keys a run commonly changes are listed here.
defaults:
  - backbone: da3g
  - _self_

name: networks.zipsplat
weights: null

gaussians_per_token: 32
num_heads: ${eval:'${.backbone.embed_dim} // 64'}

# Compression: r_min shrinks as (2 / V) ** query_scale_with_views -> ~65 tokens at every V
query_sample_ratio: [0.1, 1.0]
query_scale_with_views: 1.0

# Losses on top of the head's rendering loss (models/losses.py)
geoce_loss:
  weight: 0.05
cone_loss:
  weight: 0.01
pose_loss:
  weight: 0.05

# The head's rendering loss on the target views (decoders/gaussian_head.py)
gaussian_head:
  use_l1_loss: true  # photometric term is L1 (MSE when false), weighted by mse_weight
  mse_weight: 1.0
  lpips_weight: 0.1
  depth_weight: 0.0
  scale_penalty_weight: 1.0
  opacity_penalty_weight: 1.0

use_checkpoint: false
