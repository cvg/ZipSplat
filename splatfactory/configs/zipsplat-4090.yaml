# zipsplat.yaml on 4x4090 (24 GB): DA3-{Large / Base / Small} via model/backbone, 24 images/GPU.
defaults:
  - zipsplat
  - _self_

# save memory such that models fit in 24 GB VRAM
model:
  use_checkpoint: true
  backbone:
    use_checkpoint: true

data:
  batch_size: 96

train:
  eval_every_epoch: 5
  benchmark_every_epoch: 5
