# Evaluate the released zipsplat-252 model (the paper model) with TokenBA. The checkpoint is
# downloaded from Hugging Face on first use, so no local training run is needed:
#   python -m splatfactory.eval.run dl3dv_benchmark --conf zipsplat_eval eval.num_views=16
defaults:
  - model: zipsplat
  - _self_

model:
  name: networks.zipsplat_eval  # ZipSplat + TokenBA, model.token_ba=null skips the BA
  weights: https://huggingface.co/veichta/zipsplat/resolve/main/zipsplat-da3g-252.tar
  return_attention: false
  use_priors: false  # true injects the GT context cameras into the backbone
  backbone:
    weights: null  # the released checkpoint holds the backbone
